<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Blue</title>
    <style>
        /* --- CSS Variables for Easy Theming --- */
        :root {
            --primary-blue: #2563eb;  /* Bright Royal Blue */
            --dark-blue: #1e3a8a;     /* Deep Navy Blue */
            --light-blue: #eff6ff;    /* Very Pale Blue for borders/accents */
            --text-main: #334155;     /* Slate for readable body text */
            --bg-color: #ffffff;      /* Clean White background */
        }

        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Layout & Structure --- */
        header {
            padding: 2rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--light-blue);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-blue);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        main {
            flex: 1; /* Pushes the footer to the bottom */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 10%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* --- Typography --- */
        h1 {
            font-size: 4rem;
            color: var(--dark-blue);
            margin-bottom: 1.5rem;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        p {
            font-size: 1.25rem;
            margin-bottom: 2.5rem;
            color: var(--text-main);
            max-width: 600px;
        }

        /* --- Components --- */
        .btn {
            display: inline-block;
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 1rem 2.5rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--dark-blue);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* --- Responsive Design for Mobile --- */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: -1px;
            }
            
            p {
                font-size: 1.1rem;
            }

            main {
                padding: 3rem 5%;
            }

            header {
                padding: 1.5rem 5%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Minima.</a>
    </header>

    <main>
        <h1>Focus on what actually matters.</h1>
        <p>A minimal web design template utilizing a carefully selected blue color palette. Built purely with HTML and CSS, emphasizing typography, spacing, and simplicity.</p>
        <div>
            <a href="#" class="btn">Learn More</a>
        </div>
    </main>

    <footer>
        &copy; 2026 Minima Theme. All rights reserved.
    </footer>

</body>
</html>
