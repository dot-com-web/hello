<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="desktop">
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">README.txt - Notepad</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body">
                <h3>Welcome to 1995</h3>
                <p>This interface is built with pure HTML and CSS. No time machine required.</p>
                <hr>
                <p>To-do list:</p>
                <ul>
                    <li>Install Netscape Navigator</li>
                    <li>Listen to some MIDI files</li>
                    <li>Wait 10 minutes for a JPEG to load</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <button class="start-button">
            <img src="https://img.icons8.com/color/16/000000/windows-95.png" alt="win">
            <span>Start</span>
        </button>
        <div class="taskbar-divider"></div>
        <div class="active-tasks">
            <div class="task-item">Notepad</div>
        </div>
        <div class="system-tray">
            10:43 AM
        </div>
    </div>

</body>
</html>
